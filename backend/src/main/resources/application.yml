server:
  port: 8080

spring:
  application:
    name: elearning-backend
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/elearning-realm
          jwk-set-uri: http://localhost:8180/realms/elearning-realm/protocol/openid-connect/certs
  
  datasource:
    url: jdbc:h2:mem:elearningdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.springframework.security: DEBUG
